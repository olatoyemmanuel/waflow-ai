services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: waflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: waflow
      POSTGRES_USER: waflow
      POSTGRES_PASSWORD: waflow
    ports:
      - "5433:5432"
    volumes:
      - waflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waflow -d waflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - waflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  waflow_postgres_data:
  waflow_redis_data:

